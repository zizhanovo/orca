name: Sync upstream releases

# Daily self-merge of the newest stablyai/orca release tag into claude-config-dirs.
# Upstream cuts each release tag from main as a sibling branch, so consecutive tags share no
# release-branch history and phantom-conflict on upstream's own files. A conflicted file that
# our fork never touched is upstream-vs-upstream: the newer release side always wins (verified
# for v1.4.243 -> v1.4.245; release-branch-only commits land on main before the next cut).
# Conflicts on files in config/upstream-sync-personal-files.txt need a human; open one issue.

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-releases
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: claude-config-dirs
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve the newest upstream release tag
        id: tag
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch -q upstream 'refs/tags/v[0-9]*:refs/tags/upstream-v*' --no-tags
          latest="$(git tag --list 'upstream-v*' --sort=-v:refname | head -1 | sed 's/^upstream-//')"
          echo "latest=$latest" >>"$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "refs/tags/$latest" HEAD; then
            echo "done=true" >>"$GITHUB_OUTPUT"
            echo "$latest is already merged"
          fi

      - name: Merge the release
        if: steps.tag.outputs.done != 'true'
        id: merge
        run: |
          latest="${{ steps.tag.outputs.latest }}"
          if git merge --no-edit "refs/tags/$latest"; then
            echo "merged=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Conflicted: keep only conflicts a human must resolve.
          personal="$(cat config/upstream-sync-personal-files.txt)"
          for file in $(git diff --name-only --diff-filter=U); do
            if grep -qx "$file" "$personal"; then
              echo "needs-human: $file" >&2
              continue
            fi
            # Upstream-vs-upstream: the newer release side wins.
            if git diff --name-only --diff-filter=UD | grep -qx "$file"; then
              git rm -q "$file"
            else
              git checkout --theirs -- "$file" && git add "$file"
            fi
          done
          if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
            git commit --no-edit
            echo "merged=true" >>"$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflicts=$(git diff --name-only --diff-filter=U | paste -sd', ' -)" >>"$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.merge.outputs.merged == 'true'
        run: git push origin claude-config-dirs

      - name: Open an issue for human conflicts
        if: steps.merge.outputs.conflicts != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          gh label create upstream-sync --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Upstream release merge needs a human" 2>/dev/null || true
          body="Merging \`$LATEST\` into \`claude-config-dirs\` conflicted on fork-owned files: $CONFLICTS. Resolve locally, commit the merge, and push."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label upstream-sync --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Upstream sync needs a human merge ($LATEST)" --body "$body" --label upstream-sync
          fi
